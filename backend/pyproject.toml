[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equityiq-backend"
version = "0.1.0"
description = "EquityIQ investment research API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.115.12",
    "pydantic-settings==2.16.2",
    "psycopg[binary]==3.3.7",
    "SQLAlchemy==2.0.55",
    "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
